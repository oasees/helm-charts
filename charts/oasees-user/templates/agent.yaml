apiVersion: apps/v1
kind: DaemonSet
metadata:
  annotations:
    meta.helm.sh/release-name: oasees-user
    meta.helm.sh/release-namespace: default
  labels:
    app.kubernetes.io/managed-by: Helm
  name: oasees-agent
  namespace: default
spec:
  selector:
    matchLabels:
      component: oasees-agent
  template:
    metadata:
      labels:
        component: oasees-agent
    spec:
      hostNetwork: true
      dnsPolicy: "ClusterFirstWithHostNet"
      containers:
      - name: oasees-agent
        image: oasees/oasees-agent:latest
        imagePullPolicy: Always
        env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: CB_IP
          value: "cluster-backend.default.svc.cluster.local"
        - name: CB_PORT
          value: "4000"
        - name: CLUSTER_IP
          value: "thanos-query.default.svc.cluster.local"
        - name: TELEMETRY_IP
          value: "oasees-telemetry-api-svc.default.svc.cluster.local"